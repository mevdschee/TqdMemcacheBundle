name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            symfony: '6.4'
          - php: '8.2'
            symfony: '7.4'
          - php: '8.3'
            symfony: '7.4'
          - php: '8.4'
            symfony: '7.4'
    services:
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: memcache
          coverage: none
      - name: Install dependencies
        run: |
          composer require --no-update "symfony/framework-bundle:~${{ matrix.symfony }}.0" "symfony/console:~${{ matrix.symfony }}.0"
          composer require --dev --no-update "symfony/twig-bundle:~${{ matrix.symfony }}.0" "symfony/web-profiler-bundle:~${{ matrix.symfony }}.0"
          composer update --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/phpunit -c phpunit.xml.dist
